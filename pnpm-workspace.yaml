packages:
  - packages/*
  - examples/*
  - website

allowBuilds:
  esbuild: true
  msgpackr-extract: false

onlyBuiltDependencies:
  - esbuild
catalog:
  "@effect/platform": ^0.96.1
  "@effect/rpc": ^0.75.1
  "@types/node": ^25.9.3
  effect: ^3.21.3
  tsx: ^4.22.4
  typescript: ^6.0.3
  vite-plus: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
