packages:
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  msgpackr-extract: false

onlyBuiltDependencies:
  - esbuild
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  effect: ^3.21.3
  "@effect/platform": ^0.96.1
  "@effect/rpc": ^0.75.1
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
