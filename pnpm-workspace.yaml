packages:
  - packages/*
  - examples/*
  - website

allowBuilds:
  esbuild: true
  msgpackr-extract: false

onlyBuiltDependencies:
  - esbuild
catalog:
  "@types/node": ^26.1.1
  effect: 4.0.0-beta.98
  tstyche: ^7.2.2
  tsx: ^4.23.1
  typescript: ^7.0.2
  vite-plus: 0.2.5
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vitest: 4.1.10
  "@vitest/browser-playwright": 4.1.10
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Dedupe @types/node to the catalog version: @types/jsdom pins an older
  # major (25.x), which otherwise duplicates the copy and skews node:http
  # types (e.g. IncomingMessage.signal) in website/server.ts.
  "@types/node": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@0.2.5"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.2.5"
  - "@voidzero-dev/vite-plus-darwin-x64@0.2.5"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.5"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.2.5"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.2.5"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.2.5"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.5"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.2.5"
  - vite-plus@0.2.5
  - "@effect/tsgo-darwin-arm64@0.24.1"
  - "@effect/tsgo-darwin-x64@0.24.1"
  - "@effect/tsgo-linux-arm64@0.24.1"
  - "@effect/tsgo-linux-arm@0.24.1"
  - "@effect/tsgo-linux-x64@0.24.1"
  - "@effect/tsgo-win32-arm64@0.24.1"
  - "@effect/tsgo-win32-x64@0.24.1"
  - "@effect/tsgo@0.24.1"
