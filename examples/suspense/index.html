<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weft: Suspense</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #fff;
        color: #000;
        min-height: 100vh;
        padding: 2rem;
      }

      #root {
        max-width: 800px;
        margin: 0 auto;
      }

      /* Layout */
      .app {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .header {
        border-bottom: 1px solid #000;
        padding-bottom: 1rem;
      }
      .header h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        opacity: 0.6;
        font-size: 0.875rem;
      }
      .main {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .footer {
        border-top: 1px solid #000;
        padding-top: 1rem;
      }

      /* Sections */
      .section {
        border: 1px solid #000;
        padding: 1.5rem;
      }
      .section-title {
        font-size: 1rem;
        margin-bottom: 0.5rem;
      }
      .section-desc {
        font-size: 0.8rem;
        opacity: 0.6;
        margin-bottom: 1rem;
      }

      /* Fallback */
      .fallback {
        padding: 1rem;
        background: #f5f5f5;
        border: 1px dashed #999;
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .fallback--inner {
        background: #ebebeb;
      }
      .spinner {
        font-size: 1.25rem;
      }

      /* Cards */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }
      .card {
        border: 1px solid #000;
        padding: 1rem;
      }
      .card-title {
        font-size: 0.875rem;
        margin-bottom: 0.5rem;
      }
      .card-body {
        font-size: 0.75rem;
        opacity: 0.7;
      }

      /* Nested */
      .nested-outer {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .outer-content,
      .inner-content {
        padding: 0.75rem;
        border: 1px solid #ddd;
        font-size: 0.875rem;
      }

      /* Status */
      .status {
        display: inline-block;
        padding: 0.25rem 0.5rem;
        border: 1px solid #000;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
