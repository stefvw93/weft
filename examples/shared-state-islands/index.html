<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared State Islands - Weft</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #fff;
        min-height: 100vh;
        color: #000;
        padding: 2rem;
      }

      main {
        max-width: 800px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 1rem;
      }

      h2 {
        margin-bottom: 0.5rem;
        font-size: 1rem;
      }

      .island {
        margin: 1.5rem 0;
        padding: 1rem;
        border: 1px solid #000;
      }

      button {
        background: #000;
        color: #fff;
        border: none;
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
        margin: 0.25rem;
      }

      button:hover {
        background: #333;
      }

      .counter {
        font-size: 2rem;
        font-weight: bold;
        margin: 0.5rem 0;
      }

      .derived {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shared State Islands</h1>
      <div id="island-controls"></div>
      <div id="island-display"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
