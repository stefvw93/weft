<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headless Menu - Weft</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #fff;
        min-height: 100vh;
        color: #000;
        padding: 2rem;
      }

      #root {
        max-width: 480px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: #666;
        margin-bottom: 1.5rem;
      }

      .file-menu {
        position: relative;
      }

      .btn {
        background: #000;
        color: #fff;
        border: none;
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
      }

      .btn--open {
        background: #333;
      }

      .meta {
        color: #666;
        font-size: 0.8rem;
        margin: 0.5rem 0;
      }

      .menu-popup {
        list-style: none;
        border: 1px solid #000;
        width: 12rem;
        margin-top: 0.25rem;
      }

      .menu-popup[hidden] {
        display: none;
      }

      .menu-item {
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }

      .menu-item--highlighted {
        background: #f0f0f0;
      }

      .log {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #666;
        border-top: 1px solid #ccc;
        padding-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
