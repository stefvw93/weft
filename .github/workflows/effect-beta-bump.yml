name: Effect Beta Bump

# Advances the workspace's tested Effect 4 beta floor (see
# scripts/bump-effect-beta.mjs): checks npm's `beta` dist-tag daily, bumps the
# catalog pin + peer-range floors + "tested against" doc tokens, validates the
# workspace against the new beta, and opens a PR. If validation fails the PR is
# opened as a draft so a breaking upstream beta is visible instead of silent.
#
# Note: PRs created with the default GITHUB_TOKEN do not trigger the CI + Release
# workflow. Validation therefore runs here and its results are posted in the PR
# body. To get normal PR CI as well, add a repo secret EFFECT_BUMP_TOKEN (a PAT
# with `repo` scope) — it is used automatically when present.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump + Validate + PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Bump to latest effect beta
        id: bump
        run: node scripts/bump-effect-beta.mjs

      - name: Refresh lockfile
        if: steps.bump.outputs.updated == 'true'
        run: vp install

      - name: Validate — check
        id: check
        if: steps.bump.outputs.updated == 'true'
        continue-on-error: true
        run: vp run check

      - name: Validate — test
        id: test
        if: steps.bump.outputs.updated == 'true'
        continue-on-error: true
        run: vp run test

      - name: Cache Playwright browsers
        if: steps.bump.outputs.updated == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.bump.outputs.updated == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate — browser test
        id: test-browser
        if: steps.bump.outputs.updated == 'true'
        continue-on-error: true
        run: vp run test:browser

      - name: Collect validation outcome
        id: outcome
        if: steps.bump.outputs.updated == 'true'
        run: |
          if [ "${{ steps.check.outcome }}" = "success" ] && \
             [ "${{ steps.test.outcome }}" = "success" ] && \
             [ "${{ steps.test-browser.outcome }}" = "success" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.bump.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.EFFECT_BUMP_TOKEN || github.token }}
          branch: chore/effect-beta-bump
          delete-branch: true
          draft: ${{ steps.outcome.outputs.green == 'false' }}
          commit-message: "fix(deps): bump effect to ${{ steps.bump.outputs.version }}"
          title: "fix(deps): bump effect to ${{ steps.bump.outputs.version }}"
          body: |
            Automated bump of the tested Effect 4 beta floor to `effect@${{ steps.bump.outputs.version }}`
            (catalog pin, peer-range floors, "tested against" doc tokens, lockfile).

            Validation against the new beta (run in the [Effect Beta Bump workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})):

            - `vp run check`: **${{ steps.check.outcome }}**
            - `vp run test`: **${{ steps.test.outcome }}**
            - `vp run test:browser`: **${{ steps.test-browser.outcome }}**

            Opened as a draft when any validation step failed — a failure here
            usually means the new beta ships upstream breaking changes that need
            a migration commit on this branch before merging.
