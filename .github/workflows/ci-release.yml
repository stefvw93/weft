name: CI + Release

on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch: deploy the website without waiting for a release
  # (used for the first Pages deploy and ad-hoc redeploys).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run format, lint, and type checks together.
        run: vp run check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: vp run test

  test-types:
    name: Type Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # tstyche can't use the workspace typescript (tsgo has no JS API) and
      # fetches its own pinned TypeScript into this store on first run.
      - name: Cache TSTyche TypeScript store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/TSTyche
          key: tstyche-${{ runner.os }}-${{ hashFiles('tstyche.json') }}

      - name: Run type tests
        run: vp run test:types

  test-browser:
    name: Browser Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-browser e2e tests
        run: vp run test:browser

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [check, test, test-types, test-browser]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.test-types.result }}" != "success" ] || \
             [ "${{ needs.test-browser.result }}" != "success" ]; then
            echo "CI validation failed"
            echo "Lint: ${{ needs.check.result }}"
            echo "Test: ${{ needs.test.result }}"
            echo "Type Test: ${{ needs.test-types.result }}"
            echo "Browser Test: ${{ needs.test-browser.result }}"
            exit 1
          fi
          echo "All CI checks passed"

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [check, test, test-types, test-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      version: ${{ steps.semantic-release.outputs.version }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # No build step here: commit analysis needs no dist. `vp run pack` runs
      # inside semantic-release's prepareCmd (.releaserc.json), so packages are
      # built only when a release is actually being published.
      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpx semantic-release

  website-changes:
    name: Website Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # The push range's `before` commit can be arbitrarily old.
          fetch-depth: 0

      # The website bakes repo `docs/**` at build time (website/vite.config.ts),
      # so content changes in either tree warrant a redeploy.
      - name: Detect website/docs changes in the push range
        id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # New branch or force-push with an unreachable `before`: assume changed.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" -- website/ docs/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-website:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: [release, website-changes]
    # Runs when a release was published, when the push touched website/docs
    # content, or on manual dispatch (both needed jobs are skipped then — hence
    # !cancelled() instead of the default success() gate). Never after a failure
    # in either needed job.
    if: >-
      ${{ !cancelled() &&
          needs.release.result != 'failure' &&
          needs.website-changes.result != 'failure' &&
          (needs.release.outputs.released == 'true' ||
           needs.website-changes.outputs.changed == 'true' ||
           github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # Never cancel an in-flight Pages deployment mid-publish.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # Tags needed: website/build-version.ts derives __WEFT_VERSION__ from
          # `git describe --tags`, including the tag pushed by the release job above.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build static site
        working-directory: website
        run: vp run build:static

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/static
          # Unique per attempt: artifacts persist across re-runs of the same
          # run, and deploy-pages hard-fails when it finds more than one
          # artifact with its name (actions/deploy-pages#276).
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
